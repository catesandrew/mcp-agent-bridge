name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            suffix: linux-x64
          - os: ubuntu-latest
            target: bun-linux-arm64
            suffix: linux-arm64
          - os: macos-latest
            target: bun-darwin-arm64
            suffix: darwin-arm64
          - os: ubuntu-latest
            target: bun-darwin-x64
            suffix: darwin-x64
          - os: ubuntu-latest
            target: bun-windows-x64
            suffix: windows-x64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - run: bun run lint

      - name: Build binaries
        run: |
          mkdir -p bin
          bun build --compile --target=${{ matrix.target }} ./src/claude/server.ts --outfile ./bin/claude-mcp-server-${{ matrix.suffix }}
          bun build --compile --target=${{ matrix.target }} ./src/codex/server.ts --outfile ./bin/codex-mcp-server-${{ matrix.suffix }}
          bun build --compile --target=${{ matrix.target }} ./src/copilot/server.ts --outfile ./bin/copilot-mcp-server-${{ matrix.suffix }}

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.suffix }}
          path: ./bin/*-${{ matrix.suffix }}*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect binaries
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            cp "$dir"* release/ 2>/dev/null || true
          done
          ls -la release/

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
