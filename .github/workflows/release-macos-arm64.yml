name: Release (macOS arm64)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - run: bun run lint

      - name: Build binaries
        run: |
          mkdir -p bin
          bun build --compile --target=bun-darwin-arm64 ./src/claude/server.ts --outfile ./bin/claude-mcp-server-darwin-arm64
          bun build --compile --target=bun-darwin-arm64 ./src/codex/server.ts --outfile ./bin/codex-mcp-server-darwin-arm64
          bun build --compile --target=bun-darwin-arm64 ./src/copilot/server.ts --outfile ./bin/copilot-mcp-server-darwin-arm64

      - name: Generate checksums
        run: |
          cd bin
          shasum -a 256 * > checksums-darwin-arm64.txt
          cat checksums-darwin-arm64.txt

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ./bin/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: binaries-darwin-arm64
          path: ./bin/*
