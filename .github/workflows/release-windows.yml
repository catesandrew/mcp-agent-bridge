name: Release (Windows x64)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - run: bun run lint

      - name: Build binaries
        run: |
          mkdir -p bin
          bun build --compile --target=bun-windows-x64 ./src/claude/server.ts --outfile ./bin/claude-mcp-server-windows-x64.exe
          bun build --compile --target=bun-windows-x64 ./src/codex/server.ts --outfile ./bin/codex-mcp-server-windows-x64.exe
          bun build --compile --target=bun-windows-x64 ./src/copilot/server.ts --outfile ./bin/copilot-mcp-server-windows-x64.exe

      - name: Generate checksums
        run: |
          cd bin
          sha256sum * > checksums-windows-x64.txt
          cat checksums-windows-x64.txt

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ./bin/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: binaries-windows-x64
          path: ./bin/*

  build-msi:
    name: Build Windows MSI installer
    needs: build
    # Runs on every trigger now, not just tag pushes — a manual
    # workflow_dispatch (any branch, no tag needed) is the intended way to
    # verify this job actually works before ever cutting a real release. On
    # a tag push, inputs come from the GitHub Release the `build` job just
    # created (softprops/action-gh-release); otherwise (workflow_dispatch on
    # a branch, no release exists yet) inputs come from the workflow
    # artifact `build` uploads in that case instead (actions/upload-artifact,
    # name: binaries-windows-x64 — see the `build` job above). Same split for
    # publishing: a tag push attaches the MSI to the release, a dry run
    # instead uploads it as its own downloadable workflow artifact so it can
    # be fetched and installed on a real Windows machine for a first test.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install WiX v5 (pinned — do NOT use the default/latest version)
        # v7+ requires accepting a paid "Open Source Maintenance Fee" EULA
        # before it will even run (confirmed during authoring of this
        # installer — see installer/windows/README.md). Pin to exactly
        # 5.0.2, which has no such gate.
        run: dotnet tool install --global wix --version 5.0.2

      - name: Add WixToolset.Util.wixext extension
        # Required by Product.wxs's deferred service-registration
        # CustomActions (WixQuietExec / Wix4UtilCA_$(sys.BUILDARCHSHORT));
        # `wix build -ext WixToolset.Util.wixext` fails unless the
        # extension has been added to the local cache first.
        run: wix extension add WixToolset.Util.wixext/5.0.2

      - name: Download release binaries + checksums (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          gh release download ${{ github.ref_name }} --dir release-assets --repo ${{ github.repository }}

      - name: Download binaries artifact (dry run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/download-artifact@v4
        with:
          name: binaries-windows-x64
          path: release-assets

      - name: Build MSI
        shell: pwsh
        run: |
          ./installer/windows/build.ps1 -ArtifactsDir release-assets

      - name: Compute MSI checksum
        shell: pwsh
        run: |
          $msi = "installer/windows/dist/mcp-agent-bridge-windows-x64.msi"
          $hash = (Get-FileHash -LiteralPath $msi -Algorithm SHA256).Hash.ToLower()
          "$hash  mcp-agent-bridge-windows-x64.msi" | Out-File -FilePath "installer/windows/dist/checksums-windows-x64-msi.txt" -Encoding ascii -NoNewline

      - name: Upload MSI to release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/windows/dist/mcp-agent-bridge-windows-x64.msi
            installer/windows/dist/checksums-windows-x64-msi.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload MSI artifact (dry run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: mcp-agent-bridge-windows-x64-msi
          path: |
            installer/windows/dist/mcp-agent-bridge-windows-x64.msi
            installer/windows/dist/checksums-windows-x64-msi.txt
